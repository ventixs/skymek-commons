name: Publish

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Test
        run: ./gradlew test --no-daemon
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew publish --no-daemon -Pversion="${GITHUB_REF_NAME#v}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach the jar to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" build/libs/skymek-commons-"${GITHUB_REF_NAME#v}".jar --verify-tag --title "$GITHUB_REF_NAME" --notes "skymek-commons $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
