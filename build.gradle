plugins {
    id 'java-library'
    id 'maven-publish'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

configurations {
    mockitoAgent
}

def quarkusApis = [
        'jakarta.ws.rs:jakarta.ws.rs-api',
        'io.quarkus:quarkus-core',
        'io.quarkus:quarkus-arc',
        'io.quarkus:quarkus-security',
        'io.quarkus:quarkus-vertx-http',
        'io.quarkus:quarkus-oidc',
        'io.quarkus:quarkus-rest',
        'io.quarkus:quarkus-rest-client',
        'io.quarkus:quarkus-redis-client',
]

dependencies {
    def quarkusBom = platform("io.quarkus.platform:quarkus-bom:${quarkusPlatformVersion}")
    compileOnly quarkusBom
    quarkusApis.each { compileOnly it }

    testImplementation quarkusBom
    quarkusApis.each { testImplementation it }
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.mockito:mockito-junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    mockitoAgent quarkusBom
    mockitoAgent('org.mockito:mockito-core') {
        transitive = false
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

tasks.named('test') {
    useJUnitPlatform()
    // Mockito can no longer self-attach on recent JDKs; loading it as an agent also skips the warning.
    jvmArgumentProviders.add({ ["-javaagent:${configurations.mockitoAgent.asPath}", '-Xshare:off'] } as CommandLineArgumentProvider)
}

publishing {
    publications {
        commons(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/ventixs/skymek-commons')
            credentials {
                username = findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR') ?: 'token'
                password = findProperty('gpr.token') ?: System.getenv('GITHUB_TOKEN')
            }
        }
    }
}
